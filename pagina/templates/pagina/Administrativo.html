<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ADMINISTRACION</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
    body {
        font-family: "Poppins", sans-serif;
        background-color: #ffffff;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
    }
        .encabezado {
            background-color: #102B50;
            color: #ffffff;
            align-items: center;
            justify-content: space-between;
            padding: 0 48px;
            min-height: 76px;
            display: flex;
            gap: 24px;
            margin-bottom: 45px;
        }
            .logo {
                font-weight: 700;
                font-size: 18px;
                line-height: 1.3;
            }
                .logo span {
                    font-size: 14px;
                    font-weight: 400;
                    opacity: 0.85;
                }
            .barra-navegacion {
                display: flex;
                gap: 45px;
                list-style: none;
            }
                .barra-navegacion a {
                    color: #ffffff;
                    text-decoration: none;
                    font-size: 15px;
                }
        .seccion-principal {
            flex: 1;
            padding: 20px 40px 50px;
        }
            .titulo {
                text-align: center;
                margin-bottom: 40px;
            }
                .titulo h1 {
                    color: #9E0757;
                    font-size: 16px;
                    font-weight: 600;
                    margin-bottom: 12px;
                }
                    .titulo h2 {
                        color: #102B50;
                        font-family: "Playfair Display", Georgia, serif;
                        font-size: 35px;
                        margin-bottom: 12px;
                    }
                        .titulo h2 span {
                            color: #F9AA19;
                        }
                        .titulo p{
                            color: #687B9B;
                            font-size: 16px;
                            opacity: 0.85; /*Lo vuelve 15% transparente, para que se vea más tenue*/
                        }
        .panel {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 35px;
            padding: 25px;
            border: 1px solid #dce3ec;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(16, 43, 80, 0.08);
        }
            .panel h2 {
                color: #102B50;
                font-family: "Playfair Display", Georgia, serif;
                font-size: 25px;
                margin-bottom: 25px;
            }
        .flujo {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }
            .flujo a{
                text-decoration: none;
            }
            .estado {
                min-width: 160px;
                min-height: 85px;
                padding: 15px;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                border-radius: 12px;
                font-family: "Poppins", sans-serif;
                font-size: 15px;
                font-weight: 600;
                border: 2px solid;
                cursor: pointer;
                transition: 0.3s;
            }
                .pendiente {
                    background-color: #9E0757;
                    color: #ffffff;
                    border-color: #9E0757;
                }
                .confirmado {
                    background-color: #F9AA19;
                    color: #ffffff;
                    border-color: #F9AA19;
                }
                .reparacion {
                    background-color: #1761B5;
                    color: #ffffff;
                    border-color: #1761B5;
                }
                .reparado {
                    background-color: #9E0757;
                    color: #ffffff;
                    border-color: #9E0757;
                }
                .rechazado {
                    background-color: #F9AA19;
                    color: #ffffff;
                    border-color: #F9AA19;
                }
        .pie-pagina {
            background-color: #102B50;
            color: #ffffff;
            text-align: center;
            padding: 16px;
        }

    /*TELEFONOS*/

@media (max-width: 768px) {

    .encabezado {
        flex-direction: column;
        padding: 20px;
        gap: 20px;
    }
    .logo {
        text-align: center;
    }
    .barra-navegacion {
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    .seccion-principal {
        padding: 25px 15px 35px;
    }
    .pie-pagina {
        font-size: 12px;
        padding: 14px 10px;
    }
}
    </style>
</head>

<body>

    <header>
        <nav class="encabezado">
            <div class="logo">
                BACHEO TRANSPARENTE<br>
                <span>Alcaldía Miguel Hidalgo</span>
            </div>
            <ul class="barra-navegacion">
                <li>
                    <a href="Inicio.html">Inicio</a>
                </li>
                <li>
                    <a href="reportar-bache.html">Reportar bache</a>
                </li>
                <li>
                    <a href="presupuesto-transparencia.html">Presupuesto y transparencia</a>
                </li>
                <li>
                    <a href="acceso-administrativo.html">Acceso administrativo</a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="seccion-principal">
        <section class="titulo">
            <h1>SEGUIMIENTO DE REPORTES</h1>
            <h2>Estado de los reportes</h2>
            <p> Ingresa y comienza a reparar</p>
        </section>
        <section class="panel">
            <div class="flujo">
                <a href = "por-confirmar.html">
                <button class="estado pendiente" type="button">Por confirmar</button>
                </a>
                <a href = "confirmados.html">
                <button class="estado confirmado" type="button">Confirmados</button>
                </a>
                <a href = "en-reparacion.html">
                <button class="estado en reparacion" type="button">En reparacion</button>
                </a>
                <a href = "reparados.html">
                <button class="estado reparado" type="button">Reparados</button>
                </a>
                <a href = "rechazados.html">
                <button class="estado rechazado" type="button">Rechazados</button>
                </a>
            </div>
        </section>
    </main>
    <footer class="pie-pagina">Alcaldía Miguel Hidalgo · Bacheo transparente</footer>
</body>
</html>
